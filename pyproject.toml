[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "avdf"
version = "1.0.0"
description = "Explainable and Uncertainty-Aware Audio-Visual Deepfake Detection using Cross-Modal Attention Fusion"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
